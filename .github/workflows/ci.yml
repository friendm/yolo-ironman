name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coi
          POSTGRES_PASSWORD: coi
          POSTGRES_DB: coi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coi:coi@localhost:5432/coi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Unit and integration tests
        run: pytest -q
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke tests (JavaScript off, 375px)
        run: pytest -m e2e -q

  railway-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci
      - run: npm run check
