{% load ui %}<div class="table-wrap">
<table class="stack-sm">
  <thead><tr><th>Vendor</th><th>Document</th><th>Status</th><th>Expires</th><th><span class="sr-only">Remind</span></th></tr></thead>
  <tbody>
  {% for doc in docs %}
    <tr>
      <td><a href="{% url 'ops:vendor_detail' doc.vendor.id %}">{{ doc.vendor.business_name }}</a></td>
      <td>{{ doc.document_type.label }}</td>
      <td>{% pill doc.status %}</td>
      <td>{{ doc.expiration_date|date:"M j, Y" }}</td>
      <td class="num"><form class="inline-form" method="post" action="{% url 'ops:expiration_remind' doc.id %}">{% csrf_token %}<button class="btn btn-secondary" type="submit">Send reminder</button></form></td>
    </tr>
  {% empty %}
    <tr><td colspan="5" class="empty">Nothing here.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
