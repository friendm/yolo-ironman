# Render blueprint: web service + Django-Q2 worker + managed Postgres.
envVarGroups:
  - name: coi-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_DIGEST_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  - type: web
    name: coi-web
    runtime: python
    plan: starter
    buildCommand: ./scripts/build.sh
    preDeployCommand: ./scripts/release.sh
    startCommand: gunicorn config.wsgi --workers 3 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: coi-db
          property: connectionString
      - fromGroup: coi-secrets

  - type: worker
    name: coi-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: coi-db
          property: connectionString
      - fromGroup: coi-secrets

databases:
  - name: coi-db
    plan: basic-256mb
